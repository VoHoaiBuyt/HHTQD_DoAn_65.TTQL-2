    source: "Phân tích độ nhạy nhân hệ số độ khó SIMULATED suy từ trung vị điểm persona."
  retake_multiplier_sensitivity:
    values: [0.9, 1.0, 1.1]
    label: "GIẢ ĐỊNH kịch bản"
    source: "Phân tích độ nhạy; UCI-697 không có lịch sử học lại theo học phần."
