      source: "Ngưỡng cỡ mẫu prototype; TODO: xác nhận tiêu chuẩn với giảng viên/đánh giá NTU."

rule_engine:
  prerequisite_policy:
    strict_type:
      value: "tiên quyết"
      source: "Mô hình giả định trong giai đoạn 1; TODO: đối chiếu quy chế NTU."
    prior_study_type:
      value: "học trước"
      source: "Cho phép nếu đã học hoặc đang học, không bắt buộc đạt; TODO: xác nhận."
    concurrent_type:
      value: "song hành"
      source: "Nếu có trong CTĐT chính thức, cho phép trong cùng kỳ; dữ liệu SIMULATED hiện chưa dùng."
  risk_tiers:
    selection_target_recall:
      value: 0.90
      label: "mục tiêu validation exploratory"
      source: "Mục tiêu recall Dropout; ngưỡng được chọn bằng 5-fold OOF trên train, seed 20261105; TODO: kiểm tra lại trên dữ liệu NTU/giảng viên duyệt."
    medium_tier_recall_target:
      value: 0.98
      label: "mục tiêu validation exploratory"
      source: "Mục tiêu recall cho nhóm trung bình trở lên; ngưỡng chọn bằng 5-fold OOF trên train, seed 20261105; TODO: giảng viên duyệt."
    low_max_p_dropout:
      value: 0.029362255379757403
      label: "validation-derived exploratory"
      source: "Ngưỡng OOF lớn nhất đạt recall Dropout >= 0.98 (thấp đến trung bình); dữ liệu REAL UCI-697, seed 20261105; chưa phải ngưỡng triển khai."
    medium_max_p_dropout:
      value: 0.1386536269981684
      label: "validation-derived exploratory"
      source: "Ngưỡng OOF lớn nhất đạt recall Dropout >= 0.90 (trung bình đến cao); dữ liệu REAL UCI-697, seed 20261105; chưa phải ngưỡng triển khai."
    credit_caps:
      low: 18
      medium: 15
      high: 12
      label: "GIẢ ĐỊNH tạm"
      source: "Các kịch bản yêu cầu 12/15/18; gắn vào risk tier chỉ minh họa, TODO: quy chế NTU/giảng viên."
    expected_failed_course_caps:
      low: 2.0
      medium: 1.5
      high: 1.0
      label: "GIẢ ĐỊNH tạm"
      source: "Trần minh họa cho prototype; TODO: xác định theo đánh giá và duyệt của giảng viên."
    enforce_cap:
      value: false
      label: "GIẢ ĐỊNH mặc định an toàn"
      source: "Giới hạn tín chỉ/trượt là khuyến nghị mềm; chỉ bật cứng sau khi giảng viên duyệt."
  risk_restriction:
    selected_probability_threshold:
      value: 0.50
      label: "validation-derived exploratory"
      source: "Ngưỡng thấp nhất trong lưới đạt PPV OOF >= 0.70 và cỡ mẫu >=30; seed 20261105; chưa phải quy chế."
    minimum_probability:
      value: 0.50
      label: "GIẢ ĐỊNH chính sách"
      source: "Không hạn chế tải quanh tỷ lệ nền 32%; TODO: thẩm định bằng validation đã hiệu chuẩn."
    minimum_ppv:
      value: 0.70
      label: "GIẢ ĐỊNH chính sách"
      source: "Mục tiêu precision tối thiểu cho tầng chỉ được khuyến nghị giảm tải; TODO: giảng viên duyệt."
    minimum_count:
      value: 30
      label: "GIẢ ĐỊNH tạm"
      source: "Cỡ mẫu tối thiểu để báo PPV theo ngưỡng; TODO: xác nhận phương pháp."
    probability_grid:
      values: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75]
      label: "GIẢ ĐỊNH validation grid"
      source: "Lưới thăm dò ngưỡng restriction theo xác suất isotonic-calibrated OOF."
  graduation:
